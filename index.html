<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Moje studijní projekty</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: url("kolazscifi.png") no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    color: white;
    text-align: center;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    top: 0;
    left: 0;
}

.container {
    position: relative;
    z-index: 1;
    margin-top: 150px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    margin: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.project {
    background: #90caf9;
}
</style>
</head>
<body>

<div class="container">
    <h1>Moje studijní projekty</h1>
    <button class="project" onclick="openProject('elektro.html')">
        ⚡ Elektro kvíz
    </button>
</div>

<script>
function openProject(page) {
    window.location.href = page;
}
</script>

</body>
</html>
