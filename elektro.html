let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let quizName = "";

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function showMenu() {
    document.getElementById("menu").innerHTML = "";
    document.getElementById("menu").classList.remove("hidden");
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("end").classList.add("hidden");
    document.getElementById("title").innerText = "Vyber kvíz";

    for (let name in QUIZZES) {
        let btn = document.createElement("button");
        btn.innerText = name;
        btn.className = "menu-btn";
        btn.onclick = () => startQuiz(name);
        document.getElementById("menu").appendChild(btn);
    }
}

function startQuiz(name) {
    quizName = name;
    currentQuiz = shuffle([...QUIZZES[name]]);
    currentIndex = 0;
    score = 0;

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");
    document.getElementById("title").innerText = name;

    showQuestion();
}

function showQuestion() {
    let q = currentQuiz[currentIndex];
    document.getElementById("question").innerText = q.question;
    document.getElementById("answers").innerHTML = "";
    document.getElementById("score").innerText = `Skóre: ${score}`;

    q.answers.forEach((ans, index) => {
        let btn = document.createElement("button");
        btn.innerText = ans;
        btn.className = "answer";
        btn.onclick = () => checkAnswer(index);
        document.getElementById("answers").appendChild(btn);
    });
}

function checkAnswer(index) {
    let q = currentQuiz[currentIndex];
    let buttons = document.querySelectorAll(".answer");

    buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === q.correct) btn.classList.add("correct");
        if (i === index && i !== q.correct) btn.classList.add("wrong");
    });

    if (index === q.correct) score++;

    setTimeout(() => {
        currentIndex++;
        if (currentIndex >= currentQuiz.length) {
            showEnd();
        } else {
            showQuestion();
        }
    }, 1500);
}

function showEnd() {
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("end").classList.remove("hidden");

    let percent = Math.round(score / currentQuiz.length * 100);
    document.getElementById("finalScore").innerText =
        `${quizName}: ${score}/${currentQuiz.length} (${percent}%)`;
}

showMenu();
