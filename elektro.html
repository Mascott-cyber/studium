<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Studijní kvíz – Elektro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("kolazscifi.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 12px;
    }

    button {
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu-btn { background: #90caf9; color: black; }
    .answer { background: #ddd; color: black; }
    .correct { background: #4CAF50; color: white; }
    .wrong { background: #f44336; color: white; }
    .hidden { display: none; }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.7);
      color: #f5e6c8;
      border: 1px solid #c9a96a;
      border-radius: 6px;
      cursor: pointer;
      z-index: 1000;
    }

    @media (max-width: 600px) {
      .container { margin: 20px; padding: 20px; }
      button { font-size: 15px; }
    }
  </style>
</head>

<body>

<button class="back-btn" onclick="goToIndex()">← Zpět na rozcestník</button>

<div class="container">
  <h1 id="title">Vyber kvíz</h1>

  <div id="menu"></div>

  <div id="quiz" class="hidden">
    <h2 id="question"></h2>
    <div id="answers"></div>
    <p id="score"></p>
  </div>

  <div id="end" class="hidden">
    <h2>Konec kvízu</h2>
    <p id="finalScore"></p>
    <button class="menu-btn" onclick="showMenu()">Zpět do menu</button>
  </div>
</div>

<script>
/* ===================== DATA ===================== */

const QUIZZES = {
  "Elektro": [
    {question:"Co je elektrický proud?",answers:["Pohyb protonů","Pohyb elektronů","Napětí"],correct:1},
    {question:"Jednotka proudu?",answers:["Volt","Ampér","Ohm"],correct:1}
  ],

  "Bezpečnost": [
    {question:"Barva ochranného vodiče?",answers:["Modrá","Zelenožlutá","Černá"],correct:1}
  ],

  "Elektrické obvody": [
    {question:"Ohmův zákon?",answers:["U=I·R","R=U+I","U=R/I"],correct:0}
  ],

  "Elektrický motor – obecně": [
    {question:"Funkce motoru?",answers:["E→M","M→E","T→E"],correct:0},
    {question:"Základní části?",answers:["Stator a rotor","Cívka","Magnet"],correct:0}
  ],

  "Synchronní motor": [
    {question:"Skluz synchronního motoru?",answers:["Ano","Ne","Proměnný"],correct:1},
    {question:"Otáčky závisí na?",answers:["Zatížení","Frekvenci","Napětí"],correct:1}
  ],

  "Asynchronní motor": [
    {question:"Má skluz?",answers:["Ano","Ne","Nikdy"],correct:0},
    {question:"Nejrozšířenější motor?",answers:["DC","Synchronní","Asynchronní"],correct:2}
  ]
};

/* ===================== STAV ===================== */

let currentQuiz = [];
let currentIndex = 0;
let score = 0;
let quizName = "";

/* ===================== FUNKCE ===================== */

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function showMenu() {
  menu.innerHTML = "";
  menu.classList.remove("hidden");
  quiz.classList.add("hidden");
  end.classList.add("hidden");
  title.innerText = "Vyber kvíz";

  ["Elektro","Bezpečnost","Elektrické obvody"].forEach(name=>{
    addMenuButton(name,()=>startQuiz(name));
  });

  addMenuButton("Elektrický motor",showMotorMenu);
}

function showMotorMenu() {
  menu.innerHTML = "";
  title.innerText = "Elektrický motor";

  ["Elektrický motor – obecně","Synchronní motor","Asynchronní motor"]
    .forEach(name=>addMenuButton(name,()=>startQuiz(name)));

  addMenuButton("← Zpět",showMenu);
}

function addMenuButton(text,action) {
  let btn=document.createElement("button");
  btn.className="menu-btn";
  btn.innerText=text;
  btn.onclick=action;
  menu.appendChild(btn);
}

function startQuiz(name) {
  quizName=name;
  currentQuiz=shuffle([...QUIZZES[name]]);
  currentIndex=0;
  score=0;

  menu.classList.add("hidden");
  quiz.classList.remove("hidden");
  title.innerText=name;

  showQuestion();
}

function showQuestion() {
  let q=currentQuiz[currentIndex];
  question.innerText=q.question;
  answers.innerHTML="";
  scoreEl.innerText=`Skóre: ${score}`;

  q.answers.forEach((a,i)=>{
    let b=document.createElement("button");
    b.className="answer";
    b.innerText=a;
    b.onclick=()=>checkAnswer(i);
    answers.appendChild(b);
  });
}

function checkAnswer(i) {
  let q=currentQuiz[currentIndex];
  document.querySelectorAll(".answer").forEach((b,j)=>{
    b.disabled=true;
    if(j===q.correct)b.classList.add("correct");
    if(j===i&&j!==q.correct)b.classList.add("wrong");
  });
  if(i===q.correct)score++;
  setTimeout(()=>{
    currentIndex++;
    currentIndex>=currentQuiz.length?showEnd():showQuestion();
  },1200);
}

function showEnd() {
  quiz.classList.add("hidden");
  end.classList.remove("hidden");
  finalScore.innerText=`${quizName}: ${score}/${currentQuiz.length}`;
}

function goToIndex() {
  window.location.href="index.html";
}

/* ===================== START ===================== */

const menu=document.getElementById("menu");
const quiz=document.getElementById("quiz");
const end=document.getElementById("end");
const title=document.getElementById("title");
const question=document.getElementById("question");
const answers=document.getElementById("answers");
const scoreEl=document.getElementById("score");
const finalScore=document.getElementById("finalScore");

showMenu();
</script>

</body>
</html>
