<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">#použít v každé html-správné otevření v mobilu#

<title>Elektrotechnika – rozcestník</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #f5e6c8;
}

.container {
  max-width: 900px;
  margin: 80px auto;
  padding: 40px;
  background: rgba(0,0,0,0.7);
  border: 2px solid #6b4f2a;
  border-radius: 10px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.menu button {
  padding: 20px;
  font-size: 18px;
  cursor: pointer;
  background: #8a6a3f;
  border: none;
  color: black;
  border-radius: 6px;
}

.menu button:hover {
  background: #c9a96a;
}

.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 10px 16px;
  background: rgba(0,0,0,0.7);
  color: #f5e6c8;
  border: 1px solid #c9a96a;
  cursor: pointer;
}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← Zpět do rozcestníku</button>

<div class="container">
  <h1>Elektrotechnika</h1>

  <div class="menu">
    <button onclick="openQuiz()">🧠 Kvíz</button>
    <button onclick="openTheory()">📘 Teorie</button>
    <button onclick="openCalculations()">🧮 Výpočty</button>
  </div>
</div>

<script>
function openQuiz() {
  window.location.href = "elektro-kviz.html";
}

function openTheory() {
  alert("Teorie – zatím ve výstavbě");
}

function openCalculations() {
  alert("Výpočty – zatím ve výstavbě");
}

function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
